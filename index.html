<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="food.css" rel="stylesheet">
    <title>Healthy Meal Finder</title>
</head>
<body>
    <div class="container">
        <h1>Healthy Meal Finder</h1>

        <img id="meal-image" src="" alt="Meal Image">

        <ul id="ingredients"></ul>

        <ul id="grocery-stores"></ul>
    </div>
    <script src="food.js"></script>
</body>
</html>
